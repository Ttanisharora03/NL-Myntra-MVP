<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Myntra MVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              myntra: '#ff3f6c',
              'myntra-dark': '#d12952',
            },
            spacing: {
              'safe': 'env(safe-area-inset-bottom, 0px)',
              'safe-top': 'env(safe-area-inset-top, 0px)'
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="app" class="relative mx-auto w-full max-w-[430px] min-h-screen bg-white shadow-xl overflow-x-hidden flex flex-col">
      <div id="screen-container" class="flex-1 w-full pb-16"></div>
      <div id="bottom-nav"></div>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
